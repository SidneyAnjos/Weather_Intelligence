# databricks.yml
#
# Databricks Asset Bundle definition for the weather intelligence pipeline.
# Deploys notebooks/databricks_job_weather_pipeline.py as a scheduled
# SERVERLESS Databricks Job -- no manual clicking through the Jobs UI, no
# cluster to provision.
#
# Workspace constraint: this workspace only allows SERVERLESS compute, so the
# job has NO job_cluster. Runtime dependencies live in the serverless
# `environments` spec below (base environment databricks_ml + pip deps); a
# task references it via environment_key. Note the library/psycopg2 split:
# the serverless env installs the SOURCE `psycopg2` wheel -- `psycopg2-binary`
# aborts the serverless kernel on import (bundled libpq). Local Windows dev
# keeps psycopg2-binary (see requirements.txt).
#
# Deploy + run:
#   databricks bundle validate
#   databricks bundle deploy -t dev
#   databricks bundle run weather_sync_and_embed_job -t dev
#
# Secrets: serverless tasks can't reference {{secrets/...}} the way cluster
# env vars could, so the job script itself pulls OPENWEATHER_API_KEY from the
# `weather-pipeline` secret scope via the workspace API. Create it first:
#   databricks secrets create-scope weather-pipeline
#   databricks secrets put-secret weather-pipeline openweather-api-key
#
# The schedule is defined below (every 30 minutes). Once deployed it also
# runs automatically on that cadence without needing a manual trigger.

bundle:
  name: weather-intelligence-pipeline

# Keep the bundle payload small -- never ship the local venv or tests to
# the workspace.
sync:
  exclude:
    - ".venv"
    - "**/__pycache__/**"
    - "**/*.pyc"
    - "tests"
    - "*.md"
    - "requirements.txt"

variables:
  # NOTE: use plain city names (or "City, FullState") -- OpenWeatherMap's
  # geocoder returns 0 hits for the "City, ST" two-letter abbreviation
  # format (e.g. "IL" is parsed as the country code for Israel).
  locations:
    description: Comma-separated list of locations to sync
    default: "Chicago,Austin,Miami,Phoenix,Seattle,Denver,New York,Atlanta"
  limit:
    description: Max documents to harvest per run
    default: "100"
  batch_size:
    description: Documents per embedding batch
    default: "100"

resources:
  jobs:
    weather_sync_and_embed_job:
      name: "Weather Intelligence: sync + embed"

      # Every 30 minutes. Alerts can change quickly; forecasts change
      # slowly, but re-syncing both together keeps the pipeline simple.
      schedule:
        quartz_cron_expression: "0 */30 * * * ?"
        timezone_id: "America/Chicago"
        pause_status: UNPAUSED

      # Notify on failure so a broken sync doesn't go unnoticed.
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}

      max_concurrent_runs: 1  # don't let a slow run overlap the next schedule tick

      # Serverless compute environment for all tasks in this job.
      environments:
        - environment_key: weather_ml
          spec:
            base_environment: workspace-base-environments/databricks_ml
            dependencies:
              - databricks-sdk>=0.32
              - psycopg2>=2.9.9
              - requests>=2.31
              - sentence-transformers>=3.0
              - numpy>=1.26

      tasks:
        - task_key: sync_and_embed
          environment_key: weather_ml
          spark_python_task:
            python_file: ./notebooks/databricks_job_weather_pipeline.py
            parameters:
              - "--locations"
              - "${var.locations}"
              - "--limit"
              - "${var.limit}"
              - "--batch-size"
              - "${var.batch_size}"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-1e8b237a-8e29.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-1e8b237a-8e29.cloud.databricks.com
    run_as:
      user_name: ${workspace.current_user.userName}
